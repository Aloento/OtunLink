# 本地开发配置：`wrangler dev --config wrangler.local.toml`
# 与 wrangler.toml 的区别：
# 1. 不含 [[hyperdrive]] —— Miniflare 的 Hyperdrive 本地模拟在部分
#    wrangler/miniflare 版本上无法建立代理连接（proxy request failed），
#    本地开发直接由 postgres.js 经 DATABASE_URL 直连（workerd 出站 socket 正常）。
#    生产环境仍使用 wrangler.toml 中的 Hyperdrive binding。
# 2. 不含 routes/custom_domain —— 本地不需要自定义域名。
name = "otunlink-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[kv_namespaces]]
binding = "JWKS_CACHE"
id = "<your-kv-id>"  # 部署前回填真实 id

[vars]
S3_ENDPOINT = "<your-obs-endpoint>"  # 部署前回填完整 URL（含 https://）
S3_REGION = "eu-de"
S3_BUCKET = "<your-bucket>"

# ── 邮件（SMTP 直连，非敏感配置；SMTP_USER/SMTP_PASS 走 .dev.vars）──────────
# 发信人 <your-mail-from>（飞书 Lark 邮箱）；仅端口 465（SSL）/587（STARTTLS）。
MAIL_PROVIDER = "smtp"
MAIL_FROM = "<your-mail-from>"
SMTP_HOST = "<your-smtp-host>"
SMTP_PORT = "465"
SMTP_SECURE = "true"
SMTP_STARTTLS = "false"
SMTP_AUTH = "plain"
