name = "otunlink-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# 自定义域（musi.land zone 已在 Cloudflare 托管；部署时自动创建 CNAME 与证书）
routes = [
  { pattern = "api.otun.musi.land", custom_domain = true },
]

# ── Cloudflare 资源绑定（真实值由用户回传，见 docs/cloud-config.md）────────
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "d3f06050a92846ca950561f5d37f1232"

[[kv_namespaces]]
binding = "JWKS_CACHE"
id = "24881a3ca1404761a800540a6e809d8d"

# ── 图片存储：S3 兼容对象存储（华为云 OBS，不用 R2）──────────────────────
# Workers 无原生 S3 绑定，运行时经 aws4fetch/@aws-sdk/client-s3 访问；
# endpoint/bucket/region 为非敏感 vars，AccessKey 走 secrets（.dev.vars / wrangler secret put）。
[vars]
S3_ENDPOINT = "https://obs.eu-de.otc.t-systems.com"
S3_REGION = "eu-de"
S3_BUCKET = "ims-test-images"

# ── 邮件（SMTP 直连，非敏感配置；SMTP_HOST/SMTP_USER/SMTP_PASS 走 secrets）──
MAIL_PROVIDER = "smtp"
MAIL_FROM = "noreply@otun.musi.land"
SMTP_PORT = "465"
SMTP_SECURE = "true"
SMTP_STARTTLS = "false"
SMTP_AUTH = "plain"

# ── 每日效期预警（ck-08b）：UTC 00:00 扫描 7 天内到期与已过期批次 ──────────────
[triggers]
crons = ["0 0 * * *"]
