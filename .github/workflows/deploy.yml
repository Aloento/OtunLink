name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-web:
    name: Deploy Web (Pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter @otunlink/web build

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy apps/web/dist --project-name otunlink --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-api:
    name: Deploy API (Workers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── 邮件 SMTP 直连：写入 Worker secrets。非敏感配置
      #    （SMTP_HOST/MAIL_FROM/SMTP_PORT/SMTP_SECURE/SMTP_STARTTLS/SMTP_AUTH）已在
      #    wrangler.toml [vars]；GitHub 仓库需配置以下 secrets：SMTP_USER / SMTP_PASS。
      #    未配置时跳过，API 降级为仅站内通知。
      - name: Set SMTP_USER secret
        if: ${{ env.SMTP_USER != '' }}
        run: echo "$SMTP_USER" | npx wrangler secret put SMTP_USER
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}

      - name: Set SMTP_PASS secret
        if: ${{ env.SMTP_PASS != '' }}
        run: echo "$SMTP_PASS" | npx wrangler secret put SMTP_PASS
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}

      # ── 图片存储（华为云 OBS S3）：写入 Worker secrets（GitHub 仓库需配置
      #    S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY；endpoint/region/bucket 在 [vars]）。
      - name: Set S3_ACCESS_KEY_ID secret
        if: ${{ env.S3_ACCESS_KEY_ID != '' }}
        run: echo "$S3_ACCESS_KEY_ID" | npx wrangler secret put S3_ACCESS_KEY_ID
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}

      - name: Set S3_SECRET_ACCESS_KEY secret
        if: ${{ env.S3_SECRET_ACCESS_KEY != '' }}
        run: echo "$S3_SECRET_ACCESS_KEY" | npx wrangler secret put S3_SECRET_ACCESS_KEY
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}

      - name: Check resource ID secrets
        run: |
          test -n "$HYPERDRIVE_ID" || { echo "::error::Missing HYPERDRIVE_ID secret (Cloudflare Console > Hyperdrive)"; exit 1; }
          test -n "$KV_NAMESPACE_ID" || { echo "::error::Missing KV_NAMESPACE_ID secret (Cloudflare Console > KV)"; exit 1; }
        env:
          HYPERDRIVE_ID: ${{ secrets.HYPERDRIVE_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}

      - name: Deploy Worker
        run: |
          sed -i "s#<your-hyperdrive-id>#$HYPERDRIVE_ID#g; s#<your-kv-id>#$KV_NAMESPACE_ID#g" wrangler.toml
          npx wrangler deploy
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HYPERDRIVE_ID: ${{ secrets.HYPERDRIVE_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
